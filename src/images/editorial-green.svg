<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Green: From Poison to Purity</title>
  <desc id="description">An editorial pigment archive cover with a deep green title field, a fine upper rule and three historical green swatches.</desc>
  <rect width="1200" height="675" fill="#f4f1ea"/>
  <rect width="700" height="675" fill="#355b42"/>
  <g fill="#f4f1ea">
    <text x="56" y="58" font-family="Arial, sans-serif" font-size="14" letter-spacing="2.2">THE SECRET HISTORIES OF COLOUR</text>
    <text x="644" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="14">01</text>
    <text x="56" y="325" font-family="Georgia, serif" font-size="88" letter-spacing="-3">Green</text>
    <text x="56" y="379" font-family="Georgia, serif" font-size="38">From Poison to Purity</text>
    <text x="56" y="621" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.55">ANA VARELA · ART, DESIGN &amp; VISUAL CULTURE</text>
  </g>
  <line x1="56" y1="78" x2="644" y2="78" stroke="#f4f1ea" stroke-opacity=".68"/>
  <text x="754" y="58" fill="#725344" font-family="Arial, sans-serif" font-size="14" letter-spacing="2.2">PIGMENT ARCHIVE</text>
  <line x1="754" y1="78" x2="1144" y2="78" stroke="#c98768"/>
  <rect x="754" y="112" width="390" height="314" fill="#243f2e"/>
  <rect x="754" y="442" width="390" height="76" fill="#6f6b37"/>
  <rect x="754" y="534" width="390" height="76" fill="#a8b99b"/>
  <text x="776" y="400" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">POISON</text>
  <text x="1122" y="586" text-anchor="end" fill="#243f2e" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">PURITY</text>
</svg>
